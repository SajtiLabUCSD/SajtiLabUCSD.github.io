
<div class="well">
  <h4>News</h4>
  <ul>
    {% for item in site.data.news %}
      <li>
        <strong>{{ item.date }}</strong>
        {% if item.url %}
          <a href="{{ item.url }}" target="_blank">
            {{ item.description | markdownify }}
          </a>
        {% else %}
          {{ item.description | markdownify }}
        {% endif %}
      </li>   
    {% endfor %}
  </ul>
</div>
